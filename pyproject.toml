[project]
name = "llm-eval-harness"
version = "0.2.0"
description = "LLM evaluation harness with Claude API, Langfuse tracing, and RAGAS scoring"
requires-python = ">=3.11"
# Exact pins. This repo's CI rotted under unpinned `>=` ranges: ragas 0.4.3 still
# imports `langchain_community.chat_models.vertexai`, which langchain-community
# 0.4 removed, so a fresh install stopped importing. The combination below was
# resolved together and verified to import cleanly.
dependencies = [
    "anthropic==1.15.0",
    "langfuse==5.0.2",
    "ragas==0.4.3",
    "langchain-core==1.6.12",
    "langchain-anthropic==1.7.6",
    "langchain-community==0.3.31",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "pandas==3.0.6",
]

[project.optional-dependencies]
# Streamlit is only needed for dashboard.py, not for running evaluations.
dashboard = [
    "streamlit==1.66.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned explicitly so lint results do not depend on which ruff version the
# runner happens to resolve.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
